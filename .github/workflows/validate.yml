name: validate

on:
  push:
  pull_request:

jobs:
  # Lint once. shellcheck is a static analyser — its verdict does not vary by
  # runner OS, so paying for it twice buys nothing.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin shellcheck to the version developers run locally (0.11.0) so CI is
      # deterministic and does not drift with the runner image's bundled version.
      # An older bundled shellcheck emits an SC2015 false positive on `A && B || C`
      # (with a benign `|| true`) that 0.11.0 already suppresses. The release
      # tarball is checksum-verified before use.
      - name: Install shellcheck 0.11.0 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          version=v0.11.0
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          url="https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz"
          curl -fsSL -o shellcheck.tar.xz "$url"
          echo "${sha256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck scripts/*.sh core/hooks/*.sh scaffold/hooks/*.sh scaffold/scripts/*.sh scaffold/references/project-setup/*.sh

  # Run the suites on BOTH toolchains. These hooks ship to developer machines,
  # which on macOS means BSD sed/grep/awk/stat/date and bash 3.2 — a different
  # runtime from Ubuntu's GNU coreutils and bash 5, and the source of real past
  # bugs (the GNU `stat -f` stdout leak pinned in test-context-nudge.sh, and
  # BSD sed's lack of `\n` in a replacement, which is why the segmenter in
  # block-main-writes.sh uses awk). Ubuntu-only CI cannot see either. Note a
  # macOS dev box with Homebrew coreutils/ugnu tools ahead of /usr/bin is NOT a
  # BSD check — it silently tests GNU — so this runner is the only honest one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: toolchain provenance
        run: |
          printf 'bash: %s\n' "$BASH_VERSION"
          printf 'grep: %s\n' "$(grep --version 2>&1 | head -1)"
          printf 'sed:  %s\n' "$(sed --version 2>&1 | head -1)"
          printf 'jq:   %s\n' "$(jq --version 2>&1)"

      - name: validate marketplace manifests and components
        run: ./scripts/validate.sh

      - name: test block-main-writes hook
        run: ./scripts/test-block-main-writes.sh
      - name: test guard-secrets hook
        run: ./scripts/test-guard-secrets.sh
      - name: test checkpoint hook
        run: ./scripts/test-checkpoint.sh
      - name: test resume-inject hook
        run: ./scripts/test-resume-inject.sh
      - name: test subagent-trail hook
        run: ./scripts/test-subagent-trail.sh
      - name: test validate-config hook
        run: ./scripts/test-validate-config.sh
      - name: test milestone-runner
        run: ./scripts/test-milestone-runner.sh
      - name: test statusline example
        run: ./scripts/test-statusline.sh
      - name: test context-nudge hook
        run: ./scripts/test-context-nudge.sh
